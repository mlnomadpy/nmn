[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "nmn"
dynamic = ["version"]
authors = [{ name = "Taha Bouhsine", email = "taha@azetta.ai" }]
description = "Neural-Matter Network (NMN) - Advanced neural network layers with attention mechanisms"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.urls]
"Homepage" = "https://github.com/azettaai/nmn"
"Bug Tracker" = "https://github.com/azettaai/nmn/issues"
"Original Repository" = "https://github.com/mlnomadpy/nmn"

[project.scripts]
nmn = "nmn.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "mypy==2.3.1",
    "hatch-vcs>=0.3.0",
    "tomli>=1.1.0; python_version < '3.11'",
]
nnx = ["jax>=0.9.1", "jaxlib>=0.9.1", "flax>=0.12.5"]
torch = ["torch>=1.11.0", "torchvision>=0.12.0"]
keras = ["keras>=3.0.0"]
tf = ["tensorflow>=2.10.0"]
linen = ["jax>=0.9.1", "jaxlib>=0.9.1", "flax>=0.12.5"]
mlx = ["mlx>=0.18.0"]
all = ["nmn[nnx,torch,keras,tf,linen]"]
test = [
    "nmn[dev,all]",
    "tensorflow-datasets>=4.8.0",
    "optax>=0.1.4",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "scikit-learn>=1.1.0",
]

[tool.black]
line-length = 88
target-version = ['py310']
extend-exclude = 'src/nmn/_version\.py'
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["nmn"]
skip_glob = ["build/*", "dist/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--verbose", "--tb=short", "--strict-markers"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "torch: marks tests requiring PyTorch",
    "jax: marks tests requiring JAX/Flax",
    "tf: marks tests requiring TensorFlow",
]

[tool.mypy]
python_version = "3.10"
files = ["src/nmn"]
follow_imports = "skip"
ignore_missing_imports = true
exclude = [
    '^src/nmn/keras/conv[.]py$',
    '^src/nmn/mlx/conv[.]py$',
    '^src/nmn/mlx/fused[.]py$',
    '^src/nmn/nnx/examples/language/m3za[.]py$',
    '^src/nmn/nnx/examples/language/m3za_perf[.]py$',
    '^src/nmn/nnx/examples/vision/aether_resnet50_tpu[.]py$',
    '^src/nmn/nnx/layers/attention/multi_head[.]py$',
    '^src/nmn/nnx/layers/attention/rotary_yat[.]py$',
    '^src/nmn/nnx/layers/conv/yat_conv[.]py$',
    '^src/nmn/nnx/layers/conv/yat_conv_transpose[.]py$',
    '^src/nmn/nnx/layers/nmn[.]py$',
    '^src/nmn/tf/conv[.]py$',
    '^src/nmn/tf/nmn[.]py$',
    '^src/nmn/torch/_precision[.]py$',
    '^src/nmn/torch/base[.]py$',
    '^src/nmn/torch/layers/yat_conv1d[.]py$',
    '^src/nmn/torch/layers/yat_conv2d[.]py$',
    '^src/nmn/torch/layers/yat_conv3d[.]py$',
    '^src/nmn/torch/nmn/yat_nmn[.]py$',
]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.coverage.run]
source = ["src/nmn"]
omit = ["*/tests/*", "*/examples/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "except ImportError:",
]


[tool.hatch.version]
source = "vcs"
fallback-version = "0.2.11"

[tool.hatch.build.hooks.vcs]
version-file = "src/nmn/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nmn"]
