name: Test Suite

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'
  workflow_dispatch:

# Cancel an in-flight run when a new commit lands on the same ref. The
# test matrix is heavy (three backends × multiple Python versions); without
# this every rebase-push wastes the full previous run.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-base-collection:
    name: Test base install and optional-backend collection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install base package and test runner
      run: |
        python -m pip install --upgrade pip
        pip install numpy pytest
        pip install -e .
        pip check

    - name: Collect without optional ML frameworks
      run: pytest --collect-only -q

    - name: Run import-light CLI tests
      run: pytest tests/test_cli.py -q

  test-jax:
    name: Test JAX/Flax
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # jax/jaxlib 0.9.x requires Python >= 3.11
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v6
    
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        df -h
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install -e ".[dev]"
        pip install "jax==0.9.1" "jaxlib==0.9.1" "flax==0.12.5" optax
        pip check
    
    - name: Clear pycache
      run: |
        find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
        find . -name "*.pyc" -delete 2>/dev/null || true
    
    - name: Run JAX tests
      run: |
        pytest tests/test_nnx/ tests/test_linen/ tests/integration/ tests/benchmarks/ -v -m "not slow" --cov=nmn --cov-report=xml
      env:
        JAX_PLATFORM_NAME: cpu

    - name: Run executable JAX regression scripts
      if: matrix.python-version == '3.11'
      run: pytest tests/scripts/ -v -m "not slow"
      env:
        JAX_PLATFORM_NAME: cpu
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        flags: jax
        token: ${{ secrets.CODECOV_TOKEN }}
      continue-on-error: true

  test-torch:
    name: Test PyTorch (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # Smoke-test on macOS and Windows with the middle Python version only,
          # to keep total CI time reasonable while still catching platform regressions.
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
    - uses: actions/checkout@v6

    - name: Free disk space (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        df -h

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install -e ".[dev]"
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip check

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install -e ".[dev]"
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip check

    - name: Clear pycache (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
        find . -name "*.pyc" -delete 2>/dev/null || true

    - name: Run PyTorch tests
      run: pytest tests/test_torch/ -v --cov=nmn --cov-report=xml

    - name: Verify Windows optional-backend probe cleanup
      if: runner.os == 'Windows'
      run: >-
        python -m pytest tests/test_cli.py -v
        -k "optional_backend_probe_windows_job_kills_descendants"

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        flags: torch
        token: ${{ secrets.CODECOV_TOKEN }}
      continue-on-error: true

  test-keras:
    name: Test Keras/TF (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # macOS smoke test — TF on Windows is not reliably available in CI,
          # so we restrict cross-platform Keras/TF coverage to macOS for now.
          - os: macos-latest
            python-version: "3.11"

    steps:
    - uses: actions/checkout@v6

    - name: Free disk space (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        df -h

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install -e ".[dev]"
        pip install tensorflow
        pip check

    - name: Clear pycache
      run: |
        find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
        find . -name "*.pyc" -delete 2>/dev/null || true

    - name: Run Keras/TF tests
      run: |
        pytest tests/test_keras/ tests/test_tf/ -v --cov=nmn --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        flags: keras
        token: ${{ secrets.CODECOV_TOKEN }}
      continue-on-error: true

  test-keras-multibackend:
    name: Test Keras (${{ matrix.backend }} backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [jax, torch]

    env:
      KERAS_BACKEND: ${{ matrix.backend }}

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Keras test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install -e ".[keras]"

    - name: Install JAX backend
      if: matrix.backend == 'jax'
      run: pip install "jax==0.9.1" "jaxlib==0.9.1"

    - name: Install Torch backend
      if: matrix.backend == 'torch'
      run: pip install torch --index-url https://download.pytorch.org/whl/cpu

    - name: Verify isolated backend import
      run: |
        pip check
        python -c "import keras; import nmn.keras; assert keras.backend.backend() == '${{ matrix.backend }}'"

    - name: Run Keras backend suite
      run: pytest tests/test_keras/ -v --cov=nmn --cov-report=xml

  test-mlx:
    name: Test MLX (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Report Apple Silicon environment
      run: |
        uname -m
        sw_vers
        python -c "import platform; print(platform.platform()); print(platform.machine())"

    - name: Install MLX test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pytest pytest-cov
        pip install -e ".[mlx]"
        pip check

    - name: Verify MLX Metal device
      run: |
        python - <<'PY'
        import platform
        import mlx.core as mx

        print(f"architecture={platform.machine()}")
        print(f"default_device={mx.default_device()}")
        print(f"gpu_device={mx.gpu}")
        assert platform.machine() == "arm64"
        mx.set_default_device(mx.gpu)
        value = mx.arange(4, dtype=mx.float32) ** 2
        mx.eval(value)
        print(f"metal_smoke={value}")
        PY

    - name: Run focused MLX regressions
      run: >-
        pytest
        tests/test_mlx/test_fused.py
        tests/test_mlx/test_all_layers.py
        -v
        -k "fused_yat_score_executes_metal_kernel_on_gpu or
        gpu_array_epsilon_all_vjps_compile_and_softplus_chain or
        gpu_compiled_fused_module_lazy_epsilon_chain or
        fused_yat_array_epsilon_all_gradients_match_eager_and_compile or
        yat_nmn_fused_learnable_epsilon_gradient_parity or
        compiled_yat_nmn_preserves_softplus_epsilon_parameter_chain or
        conv_transpose_same_exact_shape_all_dimensions or
        conv_transpose1d_same_math_parity or
        gpu_conv_transpose_same_multidim_forward_and_gradient_parity or
        conv_transpose_same_multidim_forward_and_gradient_parity"

    - name: Run full MLX suite
      run: pytest tests/test_mlx/ -v --cov=nmn --cov-report=xml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install lint tools
      run: |
        pip install flake8 black isort

    - name: Lint with flake8 (errors only — fails build)
      run: |
        flake8 src/nmn --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Lint with flake8 (style warnings — informational)
      run: |
        flake8 src/nmn --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check formatting with black
      run: black --check --diff src/nmn tests

    - name: Check imports with isort
      run: isort --check-only --diff src/nmn tests

  mypy:
    name: Type Check (MyPy, typed core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        pip install "mypy==2.3.1" "numpy<2.3"
        pip install -e ".[dev]"
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install "jax==0.9.1" "jaxlib==0.9.1" "flax==0.12.5"
        # NumPy 2.5 stubs use Python 3.12 syntax, while NMN's MyPy target is 3.10.
        pip install "numpy<2.3"

    - name: Run MyPy on the PyTorch typed core
      run: |
        mypy \
          src/nmn/torch/squashers.py \
          src/nmn/torch/attention/yat_attention.py \
          src/nmn/torch/attention/performer_yat.py \
          --ignore-missing-imports --no-error-summary

    - name: Run MyPy on the NNX typed core
      run: |
        mypy \
          src/nmn/nnx/layers/_numerics.py \
          src/nmn/nnx/layers/conv/utils.py \
          src/nmn/nnx/layers/attention/masks.py \
          src/nmn/nnx/layers/attention/dot_product.py \
          src/nmn/nnx/layers/attention/maclaurin_yat.py \
          src/nmn/nnx/layers/attention/radial_yat.py \
          --ignore-missing-imports --no-error-summary
