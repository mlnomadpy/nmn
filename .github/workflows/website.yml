name: Website

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'website/docusaurus/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'website/docusaurus/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Docusaurus (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: website/docusaurus/package-lock.json

      - name: Install dependencies
        working-directory: website/docusaurus
        run: npm ci

      - name: Prepare static paper route
        run: |
          mkdir -p website/docusaurus/static/paper
          cp website/index.html website/docusaurus/static/paper/index.html

      - name: Build website
        working-directory: website/docusaurus
        run: npm run build
