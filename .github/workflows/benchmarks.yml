name: Attention Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attention-benchmark:
    name: JAX attention benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip

    - name: Install benchmark dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,nnx]"
        pip check

    - name: Record runner environment
      run: |
        uname -a
        lscpu
        python --version

    - name: Run attention benchmark
      env:
        JAX_PLATFORM_NAME: cpu
        NMN_BENCHMARK_OUTPUT: benchmark-results/attention.json
      run: pytest benchmarks/benchmark_attention_speed.py -m benchmark -v -s

    - name: Upload benchmark report
      uses: actions/upload-artifact@v7
      with:
        name: attention-benchmark-${{ github.sha }}
        path: benchmark-results/attention.json
        if-no-files-found: error
